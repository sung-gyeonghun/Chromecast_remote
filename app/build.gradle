plugins { id 'com.android.application' }
android {
    namespace 'com.morluto.remocon'
    compileSdk 35
    defaultConfig { applicationId 'com.morluto.remocon'; minSdk 26; targetSdk 35; versionCode 4; versionName '0.4.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { resources { excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] } }
}
dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    testImplementation 'junit:junit:4.13.2'
}
